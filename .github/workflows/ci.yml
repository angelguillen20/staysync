name: CI/CD

# Build + test en cada push/PR. En push a master, además despliega:
#   backend  -> imagen :<sha> en ECR -> nueva revisión de task definition -> ECS
#   frontend -> build de Vite -> S3
# Las credenciales de AWS Academy caducan cada ~4 h: antes de trabajar,
# ejecuta scripts/actualizar-secrets-github.ps1 para recargarlas.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  AWS_REGION: us-east-1
  ECS_CLUSTER: staysync-cluster
  # Vacío = staysync-front-<id de la cuenta>, así una cuenta nueva de AWS Academy no
  # obliga a tocar el workflow. Se puede fijar con la variable del repo S3_BUCKET.
  S3_BUCKET: ${{ vars.S3_BUCKET }}

jobs:
  backend:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: bff
            path: StaySync_BFF-bff_v1.0/StaySync_BFF-bff_v1.0
          - service: usuarios
            path: StaySync_Usuarios-usuarios_v1.0/StaySync_Usuarios-usuarios_v1.0
          - service: habitaciones
            path: StaySync_Habitaciones-habitaciones_v1.0/StaySync_Habitaciones-habitaciones_v1.0
          - service: reservas
            path: StaySync_Reservas-reservas_v1.1/StaySync_Reservas-reservas_v1.1
          - service: servicios
            path: StaySync_Servicios-servicios_v1.0/StaySync_Servicios-servicios_v1.0
          - service: pagos
            path: StaySync_Pago-pagos_v1.0/StaySync_Pago-pagos_v1.0
          - service: notificaciones
            path: StaySync_Notificaciones-notificaciones_v1.0/StaySync_Notificaciones-notificaciones_v1.0
          - service: ota
            path: StaySync_OTA-ota_v1.0/StaySync_OTA-ota_v1.0
          # Librerías compartidas: solo se testean, no tienen imagen ni servicio en ECS
          - service: commons
            path: StaySync_Commons
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: ${{ matrix.path }}/pom.xml

      - name: Instalar librerías compartidas (StaySync_Commons)
        run: mvn -B -q -f StaySync_Commons/pom.xml install -DskipTests

      - name: mvn test
        working-directory: ${{ matrix.path }}
        run: mvn -B -q test

      - name: Publicar resultados de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ matrix.service }}
          path: ${{ matrix.path }}/target/surefire-reports
          retention-days: 5

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend-StaySync-StaySync_Front_v1.1/Frontend-StaySync-StaySync_Front_v1.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Frontend-StaySync-StaySync_Front_v1.1/Frontend-StaySync-StaySync_Front_v1.1/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Tests unitarios
        run: npm run test:run

      - name: Build de producción
        run: npm run build

  deploy-backend:
    name: deploy ${{ matrix.service }}
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    concurrency: deploy-${{ matrix.service }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: bff
            path: StaySync_BFF-bff_v1.0/StaySync_BFF-bff_v1.0
          - service: usuarios
            path: StaySync_Usuarios-usuarios_v1.0/StaySync_Usuarios-usuarios_v1.0
          - service: habitaciones
            path: StaySync_Habitaciones-habitaciones_v1.0/StaySync_Habitaciones-habitaciones_v1.0
          - service: reservas
            path: StaySync_Reservas-reservas_v1.1/StaySync_Reservas-reservas_v1.1
          - service: servicios
            path: StaySync_Servicios-servicios_v1.0/StaySync_Servicios-servicios_v1.0
          - service: pagos
            path: StaySync_Pago-pagos_v1.0/StaySync_Pago-pagos_v1.0
          - service: notificaciones
            path: StaySync_Notificaciones-notificaciones_v1.0/StaySync_Notificaciones-notificaciones_v1.0
          # OTA solo se testea: no tiene repositorio ECR ni servicio ECS en la cuenta actual
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Credenciales AWS Academy
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login a ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build y push de la imagen
        id: image
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/staysync-${{ matrix.service }}:${{ github.sha }}
        run: |
          # Contexto = raíz del repo: los Dockerfiles copian StaySync_Commons
          docker build -f ${{ matrix.path }}/Dockerfile -t $IMAGE .
          docker push $IMAGE
          echo "uri=$IMAGE" >> $GITHUB_OUTPUT

      - name: Nueva revisión de task definition y deploy
        env:
          SVC: ${{ matrix.service }}
          IMAGE: ${{ steps.image.outputs.uri }}
        run: |
          # LabRole ya no puede leer Secrets Manager (SCP de AWS Academy): el script los lee con
          # estas credenciales y los pasa como variables de entorno, enmascarados en el log
          # El BFF guarda las fotos en media/ del bucket del frontend
          BUCKET=${S3_BUCKET:-staysync-front-$(aws sts get-caller-identity --query Account --output text)}
          python3 scripts/deploy/task_definition.py "$SVC" "$IMAGE" td.json MEDIA_BUCKET="$BUCKET"
          ARN=$(aws ecs register-task-definition --cli-input-json file://td.json \
                  --query taskDefinition.taskDefinitionArn --output text)
          rm td.json
          echo "Nueva task definition: $ARN"
          aws ecs update-service --cluster $ECS_CLUSTER --service $SVC --task-definition $ARN > /dev/null
          aws ecs wait services-stable --cluster $ECS_CLUSTER --services $SVC

  deploy-frontend:
    name: deploy frontend
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    concurrency: deploy-frontend
    defaults:
      run:
        working-directory: Frontend-StaySync-StaySync_Front_v1.1/Frontend-StaySync-StaySync_Front_v1.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Frontend-StaySync-StaySync_Front_v1.1/Frontend-StaySync-StaySync_Front_v1.1/package-lock.json

      - name: Credenciales AWS Academy
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build de producción
        env:
          VITE_BFF_URL: ${{ vars.VITE_BFF_URL }}
          VITE_SESSION_TIMEOUT_MIN: ${{ vars.VITE_SESSION_TIMEOUT_MIN }}
          VITE_COGNITO_DOMAIN: ${{ vars.VITE_COGNITO_DOMAIN }}
          VITE_COGNITO_CLIENT_ID: ${{ vars.VITE_COGNITO_CLIENT_ID }}
        run: |
          npm ci
          npm run build

      - name: Publicar en S3
        run: |
          BUCKET=${S3_BUCKET:-staysync-front-$(aws sts get-caller-identity --query Account --output text)}
          # media/ son las fotos que suben los hoteles: --delete las borraría en cada deploy
          aws s3 sync dist s3://$BUCKET --delete --exclude "media/*"
