name: CI/CD

# Build + test en cada push/PR. En push a master, además despliega:
#   backend  -> imagen :<sha> en ECR -> nueva revisión de task definition -> ECS
#   frontend -> build de Vite -> S3
# Las credenciales de AWS Academy caducan cada ~4 h: antes de trabajar,
# ejecuta scripts/actualizar-secrets-github.ps1 para recargarlas.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  AWS_REGION: us-east-1
  ECS_CLUSTER: staysync-cluster
  # Vacío = staysync-front-<id de la cuenta>, así una cuenta nueva de AWS Academy no
  # obliga a tocar el workflow. Se puede fijar con la variable del repo S3_BUCKET.
  S3_BUCKET: ${{ vars.S3_BUCKET }}

jobs:
  backend:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Cada servicio vive en backend/<servicio>; commons son las librerías compartidas
        # (solo se testean, no tienen imagen ni servicio en ECS)
        service: [bff, usuarios, habitaciones, reservas, servicios, pagos, notificaciones, ota, commons]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/${{ matrix.service }}/pom.xml

      - name: Instalar librerías compartidas (backend/commons)
        run: mvn -B -q -f backend/commons/pom.xml install -DskipTests

      - name: mvn test
        working-directory: backend/${{ matrix.service }}
        run: mvn -B -q test

      - name: Publicar resultados de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ matrix.service }}
          path: backend/${{ matrix.service }}/target/surefire-reports
          retention-days: 5

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Tests unitarios
        run: npm run test:run

      - name: Build de producción
        run: npm run build

  deploy-backend:
    name: deploy ${{ matrix.service }}
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    concurrency: deploy-${{ matrix.service }}
    strategy:
      fail-fast: false
      matrix:
        # OTA solo se testea: no tiene repositorio ECR ni servicio ECS en la cuenta actual
        service: [bff, usuarios, habitaciones, reservas, servicios, pagos, notificaciones]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Credenciales AWS Academy
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login a ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build y push de la imagen
        id: image
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/staysync-${{ matrix.service }}:${{ github.sha }}
        run: |
          # Contexto = raíz del repo: los Dockerfiles copian backend/commons
          docker build -f backend/${{ matrix.service }}/Dockerfile -t $IMAGE .
          docker push $IMAGE
          echo "uri=$IMAGE" >> $GITHUB_OUTPUT

      - name: Nueva revisión de task definition y deploy
        env:
          SVC: ${{ matrix.service }}
          IMAGE: ${{ steps.image.outputs.uri }}
          # Cuentas demo del login (contraseñas publicadas): false para apagarlas en producción
          DEMO_DATA_ENABLED: ${{ vars.DEMO_DATA_ENABLED || 'true' }}
          # Remitente verificado en Brevo: sin él notificaciones-service no arranca
          MAIL_FROM: ${{ vars.MAIL_FROM }}
        run: |
          if [ "$SVC" = notificaciones ] && [ -z "$MAIL_FROM" ]; then
            echo "::error::Falta la variable MAIL_FROM del repositorio (gh variable set MAIL_FROM --body <remitente verificado>)"
            exit 1
          fi
          # LabRole ya no puede leer Secrets Manager (SCP de AWS Academy): el script los lee con
          # estas credenciales y los pasa como variables de entorno, enmascarados en el log
          # El BFF guarda las fotos en media/ del bucket del frontend
          BUCKET=${S3_BUCKET:-staysync-front-$(aws sts get-caller-identity --query Account --output text)}
          python3 scripts/deploy/task_definition.py "$SVC" "$IMAGE" td.json MEDIA_BUCKET="$BUCKET" \
            DEMO_DATA_ENABLED="$DEMO_DATA_ENABLED" MAIL_FROM="$MAIL_FROM"
          ARN=$(aws ecs register-task-definition --cli-input-json file://td.json \
                  --query taskDefinition.taskDefinitionArn --output text)
          rm td.json
          echo "Nueva task definition: $ARN"
          aws ecs update-service --cluster $ECS_CLUSTER --service $SVC --task-definition $ARN > /dev/null
          aws ecs wait services-stable --cluster $ECS_CLUSTER --services $SVC

  deploy-frontend:
    name: deploy frontend
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    concurrency: deploy-frontend
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Credenciales AWS Academy
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build de producción
        env:
          VITE_BFF_URL: ${{ vars.VITE_BFF_URL }}
          VITE_SESSION_TIMEOUT_MIN: ${{ vars.VITE_SESSION_TIMEOUT_MIN }}
          VITE_COGNITO_DOMAIN: ${{ vars.VITE_COGNITO_DOMAIN }}
          VITE_COGNITO_CLIENT_ID: ${{ vars.VITE_COGNITO_CLIENT_ID }}
          # Botones de cuentas demo en el login, a la par con DEMO_DATA_ENABLED del backend
          VITE_DEMO_CREDENCIALES: ${{ vars.DEMO_DATA_ENABLED || 'true' }}
        run: |
          npm ci
          npm run build

      - name: Publicar en S3
        run: |
          BUCKET=${S3_BUCKET:-staysync-front-$(aws sts get-caller-identity --query Account --output text)}
          # media/ son las fotos que suben los hoteles: --delete las borraría en cada deploy
          aws s3 sync dist s3://$BUCKET --delete --exclude "media/*"
