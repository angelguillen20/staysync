server:
  port: ${SERVER_PORT:8082}

spring:
  cloud:
    aws:
      region:
        static: ${AWS_REGION:us-east-1}
      # Consumo de la cola SQS: apagado por defecto (tests, entornos sin mensajería)
      sqs:
        enabled: ${EVENTOS_ENABLED:false}
  application:
    name: habitaciones-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/habitaciones_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
services:
  reservas:
    url: ${RESERVAS_SERVICE_URL:http://localhost:8083}
  ota:
    url: ${OTA_SERVICE_URL:http://localhost:8087}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

resilience4j:
  circuitbreaker:
    instances:
      reservasServiceCB:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        slow-call-duration-threshold: 3s
        slow-call-rate-threshold: 50

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers

logging:
  level:
    com.staysync: INFO

staysync:
  tenant:
    # Toda petición de negocio debe traer X-Tenant-Id (lo pone el BFF a partir del JWT)
    requerido: true
    default-id: ${DEFAULT_TENANT_ID:staysync-demo}
    # Índices únicos que pasan a ser únicos por hotel (migración al arrancar)
    unicos-por-hotel: habitaciones.numero
  eventos:
    # true = el outbox se publica en SNS (necesita LocalStack o AWS)
    publicar: ${EVENTOS_ENABLED:false}
    topic-arn: ${EVENTOS_TOPIC_ARN:arn:aws:sns:us-east-1:000000000000:staysync-eventos}
    cola: ${EVENTOS_COLA:habitaciones-q}
