server:
  port: ${SERVER_PORT:8086}

spring:
  cloud:
    aws:
      region:
        static: ${AWS_REGION:us-east-1}
      # Consumo de la cola SQS: apagado por defecto (tests, entornos sin mensajería)
      sqs:
        enabled: ${EVENTOS_ENABLED:false}
  application:
    name: notificaciones-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/notificaciones_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  # ─────────────────────────────────────────────────────────────
  # SMTP — usa Mailtrap para desarrollo local (gratuito)
  # 1. Crea cuenta en https://mailtrap.io
  # 2. Ve a Email Testing → Inboxes → tu inbox → SMTP Settings
  # 3. Copia Username y Password y ponlos aquí (o en env vars)
  # Para producción: cambia host a smtp.gmail.com, port a 587
  # ─────────────────────────────────────────────────────────────
  mail:
    host: ${MAIL_HOST:smtp-relay.brevo.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:aafc0f001@smtp-brevo.com}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  health:
    # Un SMTP caído o con credenciales malas no debe marcar el servicio como caído
    # (ECS y docker-compose reiniciarían la tarea por un problema externo)
    mail:
      enabled: false

notificaciones:
  mail:
    enabled: ${MAIL_ENABLED:true}   # false = solo loguea, true = envía SMTP real

logging:
  level:
    com.staysync: DEBUG

staysync:
  tenant:
    # Toda petición de negocio debe traer X-Tenant-Id (lo pone el BFF a partir del JWT)
    requerido: true
    default-id: ${DEFAULT_TENANT_ID:staysync-demo}
  eventos:
    # true = el outbox se publica en SNS (necesita LocalStack o AWS)
    publicar: ${EVENTOS_ENABLED:false}
    topic-arn: ${EVENTOS_TOPIC_ARN:arn:aws:sns:us-east-1:000000000000:staysync-eventos}
    cola: ${EVENTOS_COLA:notificaciones-q}
