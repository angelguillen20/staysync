version: '3.9'

# ─────────────────────────────────────────────────────────────────────────────
# StaySync — Docker Compose PRODUCCIÓN
#
# Usa imágenes pre-construidas desde Amazon ECR (no compila en el servidor).
# Requiere haber hecho push de las imágenes primero:
#   ./scripts/build-and-push.sh 1.0.0
#
# Uso:
#   cp .env.example .env   # rellenar con valores reales
#   docker compose -f docker-compose.prod.yml up -d
# ─────────────────────────────────────────────────────────────────────────────

networks:
  staysync-net:
    driver: bridge

volumes:
  mysql_usuarios:
  mysql_habitaciones:
  mysql_reservas:
  mysql_servicios:
  mysql_pagos:
  mysql_notificaciones:
  mysql_ota:

# Versión de imágenes a desplegar — cambiar al hacer release
x-image-tag: &image-tag ${IMAGE_TAG:-1.0.0}
x-registry: &registry ${ECR_REGISTRY:-your-account.dkr.ecr.us-east-1.amazonaws.com}

services:

  # ── Infraestructura ─────────────────────────────────────────────────────────

  mysql-usuarios:
    image: mysql:8.0
    container_name: staysync-mysql-usuarios
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: usuarios_db
      MYSQL_USER: ${MYSQL_USER:-staysync}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_usuarios:/var/lib/mysql
    networks:
      - staysync-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  mysql-habitaciones:
    image: mysql:8.0
    container_name: staysync-mysql-habitaciones
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: habitaciones_db
      MYSQL_USER: ${MYSQL_USER:-staysync}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_habitaciones:/var/lib/mysql
    networks:
      - staysync-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  mysql-reservas:
    image: mysql:8.0
    container_name: staysync-mysql-reservas
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: reservas_db
      MYSQL_USER: ${MYSQL_USER:-staysync}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_reservas:/var/lib/mysql
    networks:
      - staysync-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  mysql-servicios:
    image: mysql:8.0
    container_name: staysync-mysql-servicios
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: servicios_db
      MYSQL_USER: ${MYSQL_USER:-staysync}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_servicios:/var/lib/mysql
    networks:
      - staysync-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  mysql-pagos:
    image: mysql:8.0
    container_name: staysync-mysql-pagos
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: pagos_db
      MYSQL_USER: ${MYSQL_USER:-staysync}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_pagos:/var/lib/mysql
    networks:
      - staysync-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  mysql-notificaciones:
    image: mysql:8.0
    container_name: staysync-mysql-notificaciones
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: notificaciones_db
      MYSQL_USER: ${MYSQL_USER:-staysync}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_notificaciones:/var/lib/mysql
    networks:
      - staysync-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  mysql-ota:
    image: mysql:8.0
    container_name: staysync-mysql-ota
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ota_db
      MYSQL_USER: ${MYSQL_USER:-staysync}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_ota:/var/lib/mysql
    networks:
      - staysync-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Microservicios (imágenes desde ECR) ────────────────────────────────────

  usuarios:
    image: ${ECR_REGISTRY}/staysync-usuarios:${IMAGE_TAG:-1.0.0}
    container_name: staysync-usuarios
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-usuarios:3306/usuarios_db?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-staysync}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      AES_ENCRYPTION_KEY: ${AES_ENCRYPTION_KEY}
    depends_on:
      mysql-usuarios:
        condition: service_healthy
    networks:
      - staysync-net

  habitaciones:
    image: ${ECR_REGISTRY}/staysync-habitaciones:${IMAGE_TAG:-1.0.0}
    container_name: staysync-habitaciones
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-habitaciones:3306/habitaciones_db?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-staysync}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SERVICES_OTA_URL: http://ota:8087
    depends_on:
      mysql-habitaciones:
        condition: service_healthy
    networks:
      - staysync-net

  reservas:
    image: ${ECR_REGISTRY}/staysync-reservas:${IMAGE_TAG:-1.0.0}
    container_name: staysync-reservas
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-reservas:3306/reservas_db?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-staysync}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SERVICES_HABITACIONES_URL: http://habitaciones:8082
    depends_on:
      mysql-reservas:
        condition: service_healthy
    networks:
      - staysync-net

  servicios:
    image: ${ECR_REGISTRY}/staysync-servicios:${IMAGE_TAG:-1.0.0}
    container_name: staysync-servicios
    restart: unless-stopped
    ports:
      - "8084:8084"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-servicios:3306/servicios_db?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-staysync}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      mysql-servicios:
        condition: service_healthy
    networks:
      - staysync-net

  pagos:
    image: ${ECR_REGISTRY}/staysync-pagos:${IMAGE_TAG:-1.0.0}
    container_name: staysync-pagos
    restart: unless-stopped
    ports:
      - "8085:8085"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-pagos:3306/pagos_db?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-staysync}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      JWT_SECRET: ${JWT_SECRET}
      RESERVAS_SERVICE_URL: http://reservas:8083
    depends_on:
      mysql-pagos:
        condition: service_healthy
    networks:
      - staysync-net

  notificaciones:
    image: ${ECR_REGISTRY}/staysync-notificaciones:${IMAGE_TAG:-1.0.0}
    container_name: staysync-notificaciones
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-notificaciones:3306/notificaciones_db?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-staysync}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      SPRING_MAIL_PORT: ${MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD}
    depends_on:
      mysql-notificaciones:
        condition: service_healthy
    networks:
      - staysync-net

  ota:
    image: ${ECR_REGISTRY}/staysync-ota:${IMAGE_TAG:-1.0.0}
    container_name: staysync-ota
    restart: unless-stopped
    ports:
      - "8087:8087"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-ota:3306/ota_db?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-staysync}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      mysql-ota:
        condition: service_healthy
    networks:
      - staysync-net

  bff:
    image: ${ECR_REGISTRY}/staysync-bff:${IMAGE_TAG:-1.0.0}
    container_name: staysync-bff
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      JWT_SECRET: ${JWT_SECRET}
      SERVICES_USUARIOS_URL: http://usuarios:8081
      SERVICES_HABITACIONES_URL: http://habitaciones:8082
      SERVICES_RESERVAS_URL: http://reservas:8083
      SERVICES_SERVICIOS_URL: http://servicios:8084
      SERVICES_PAGOS_URL: http://pagos:8085
      SERVICES_NOTIFICACIONES_URL: http://notificaciones:8086
    depends_on:
      - usuarios
      - habitaciones
      - reservas
      - servicios
      - pagos
      - notificaciones
    networks:
      - staysync-net

  frontend:
    image: ${ECR_REGISTRY}/staysync-frontend:${IMAGE_TAG:-1.0.0}
    container_name: staysync-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - bff
    networks:
      - staysync-net
