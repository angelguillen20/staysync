sonar.projectKey=staysync
sonar.projectName=StaySync
sonar.sourceEncoding=UTF-8

# Codigo fuente: microservicios Java + frontend React
sonar.sources=\
backend/bff/src/main,\
backend/habitaciones/src/main,\
backend/notificaciones/src/main,\
backend/ota/src/main,\
backend/pagos/src/main,\
backend/reservas/src/main,\
backend/servicios/src/main,\
backend/usuarios/src/main,\
frontend/src

# Tests
sonar.tests=\
backend/bff/src/test,\
backend/habitaciones/src/test,\
backend/notificaciones/src/test,\
backend/ota/src/test,\
backend/pagos/src/test,\
backend/reservas/src/test,\
backend/servicios/src/test,\
backend/usuarios/src/test

# Clases compiladas (requiere mvn compile en cada servicio antes de escanear)
sonar.java.binaries=**/target/classes

sonar.exclusions=**/node_modules/**,**/dist/**,**/target/**
